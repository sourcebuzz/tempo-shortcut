[package]
name = "tempo-shortcut"
version = "0.1.0"
edition = "2024"
description = "Linux tray icon for tracking time on Jira/Tempo issues"

[dependencies]
ksni = { version = "0.3", features = ["blocking"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
dirs = "5"
